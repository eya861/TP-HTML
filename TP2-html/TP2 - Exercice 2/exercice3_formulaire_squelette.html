<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exercice 3 - Formulaire d'inscription</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    input:invalid { border-color: #cc0000; }
    input:valid { border-color: #2e7d32; }
    button { margin-top: 20px; padding: 10px 16px; }
  </style>
</head>
<body>
  <h1>Inscription</h1>

  <!--
    OBJECTIF DE L'EXERCICE :
    Compléter ce formulaire pour qu'il soit validé ENTIEREMENT par le navigateur,
    sans JavaScript pour la validation elle-même :

    1. Nom d'utilisateur : requis, 3 à 16 caractères, lettres/chiffres/underscore uniquement
       -> utiliser "pattern" et "title" pour le message d'aide
    2. Email : requis, type email natif
    3. Mot de passe : requis, minimum 8 caractères, au moins une majuscule et un chiffre
       -> pattern à construire avec une regex
    4. Date de naissance : requis, l'utilisateur doit avoir au moins 16 ans
       -> type="date" + attribut "max" calculé
    5. Pays : à choisir dans une liste avec autocomplétion -> utiliser <datalist>
    6. Ajouter un bouton de soumission qui déclenche l'UI de validation native
  -->

  <form >
    <label for="username">Nom d'utilisateur</label>
    <input type="text" id="username" name="username" required minlength="3" maxlength="16" pattern="[A-Za-z0-9_]+" title="3 à 16 caractères, lettres, chiffres ou underscore uniquement">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" required minlength="8" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)" title="Au moins 8 caractères, une majuscule et un chiffre">

    <label for="birthdate">Date de naissance</label>
    <input type="date" id="birthdate" name="birthdate" required max="2010-10-10">

    <label for="country">Pays</label>
    <input type="text" id="country" name="country" list="pays" required>

    <datalist id="pays">
      <option value="Tunisie">
      <option value="France">
      <option value="Suisse">
      <option value="Allemagne">
      <option value="Espagne">
      <option value="Italie">
      <option value="Belgique">
      <option value="Canada">
      
        
    </datalist>

    <button type="submit">S'inscrire</button>
  </form>
</body>
</html>
